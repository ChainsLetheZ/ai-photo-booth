
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UX ML4 Mosaic Event</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#020617', // Deep Space Blue
                surface: '#0f172a',
                accent: '#38bdf8', // Sky Blue
                purple: '#c084fc', // Nebula Purple
                yellow: '#fde047', // Star Yellow
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              serif: ['"Playfair Display"', 'serif'],
            },
            animation: {
              'spin-slow': 'spin 60s linear infinite',
              'spin-slower': 'spin 120s linear infinite',
              'reverse-spin': 'reverseSpin 80s linear infinite',
              'float-space': 'floatSpace 10s ease-in-out infinite',
              'twinkle': 'twinkle 4s ease-in-out infinite',
              'scan': 'scan 2s linear infinite',
              'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'print-photo': 'printPhoto 1s cubic-bezier(0.25, 1, 0.5, 1) forwards',
              'spin-3d': 'spin3d 5s linear infinite',
              'pan-continuous': 'panContinuous 120s linear infinite',
              'develop': 'developPhoto 3s ease-in-out forwards',
              'impact-shake': 'impactShake 0.3s cubic-bezier(.36,.07,.19,.97) both', // New Shake
            },
            keyframes: {
              spin: {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              },
              reverseSpin: {
                '0%': { transform: 'rotate(360deg)' },
                '100%': { transform: 'rotate(0deg)' },
              },
              floatSpace: {
                '0%': { transform: 'translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg)' },
                '33%': { transform: 'translate3d(20px, -40px, 30px) rotateX(15deg) rotateY(10deg)' },
                '66%': { transform: 'translate3d(-20px, 20px, -30px) rotateX(-10deg) rotateY(-5deg)' },
                '100%': { transform: 'translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg)' },
              },
              twinkle: {
                '0%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
                '50%': { opacity: '1', transform: 'scale(1.2)' },
              },
              scan: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '50%': { opacity: '1' },
                '100%': { transform: 'translateY(100%)', opacity: '0' },
              },
              popIn: {
                '0%': { transform: 'scale(0.8)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              printPhoto: {
                '0%': { transform: 'translateY(-120%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              spin3d: {
                '0%': { transform: 'rotateX(25deg) rotateY(0deg)' },
                '100%': { transform: 'rotateX(25deg) rotateY(360deg)' },
              },
              panContinuous: {
                '0%': { transform: 'translate(0, 0)' },
                '100%': { transform: 'translate(-20%, -20%)' },
              },
              developPhoto: {
                '0%': { filter: 'brightness(3) contrast(0.5) blur(2px)', opacity: '0.2' },
                '50%': { filter: 'brightness(1.5) contrast(0.8) blur(0.5px)', opacity: '0.8' },
                '100%': { filter: 'brightness(1.1) contrast(1.1) blur(0px)', opacity: '1' },
              },
              // New Shake Animation
              impactShake: {
                '10%, 90%': { transform: 'translate3d(-2px, -2px, 0)' },
                '20%, 80%': { transform: 'translate3d(4px, 4px, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-6px, -6px, 0)' },
                '40%, 60%': { transform: 'translate3d(6px, 6px, 0)' }
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #020617;
        color: white;
        overflow: hidden; 
      }
      .scene-3d { transform-style: preserve-3d; }
      .star { position: absolute; background: white; border-radius: 50%; }
      .transform-style-3d { transform-style: preserve-3d; }

      @media print {
        body, html {
          background-color: white !important;
          color: black !important;
          margin: 0;
          padding: 0;
          overflow: visible !important;
        }
        /* Hide everything by default during print */
        body * {
          visibility: hidden;
        }
        /* Except the polaroid and its children */
        #printable-polaroid, #printable-polaroid * {
          visibility: visible;
        }
        /* Center the polaroid cleanly on the page */
        #printable-polaroid {
          position: fixed !important;
          left: 50% !important;
          top: 50% !important;
          transform: translate(-50%, -50%) !important;
          width: 100% !important;
          max-width: 400px !important;
          height: auto !important;
          margin: 0 !important;
          padding: 20px !important;
        }
        /* Remove 3D transforms and animations during print */
        .print-reset, .print-reset * {
          animation: none !important;
          transform: none !important;
          transition: none !important;
          box-shadow: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.3",
    "firebase/app": "https://esm.sh/firebase@10.8.0/app",
    "firebase/database": "https://esm.sh/firebase@10.8.0/database",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "qrcode": "https://esm.sh/qrcode@1.5.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
